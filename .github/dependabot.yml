version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Major versions are updated manually
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      nuget:
        applies-to: version-updates
        patterns: ['*']
      nuget-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /src/AspNet.AssetManager.Demo
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Major versions are updated manually
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Keep in line with the default ASP.NET Core templates, which use jQuery 3
      - dependency-name: jquery
        update-types: [version-update:semver-major]
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
